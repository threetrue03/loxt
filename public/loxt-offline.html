<!doctype html><html lang="ko"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#242423"><title>LOXT · PC에 다시 연결</title><link rel="stylesheet" href="/loxt-offline.css"></head><body><main class="web-connect"><img src="/brand/LOXT-lockup-white.svg" alt="LOXT" width="150"><h1>PC에 다시 연결</h1><p role="status">PC 연결 서버에 닿지 못했습니다. PC에서 LOXT를 실행하고 같은 Wi-Fi에 연결한 뒤 다시 확인하세요. 이 화면에서 브라우저에 남은 초안 사본을 받을 수 있습니다.</p><button id="retry" type="button">다시 확인</button><form><label for="address">새 연결 주소</label><input id="address" inputmode="url" autocomplete="off" spellcheck="false" placeholder="PC에서 복사한 연결 주소"><p class="hint">주소가 바뀌면 기존 초안은 자동으로 전달되지 않습니다. 아래 사본을 보관한 후 새 주소를 여세요. 인증서 신뢰와 PC 승인이 필요합니다.</p><label class="check"><input type="checkbox" id="backup"> 필요한 메모·필기·녹음 사본을 보관했습니다</label><button type="submit">이 주소 열기</button></form><p id="error" role="alert"></p><button id="drafts" type="button">메모·필기 초안 사본 받기</button><p id="count" class="hint"></p><div id="recordings"></div><p class="hint">연결 후 연결 관리 → 초안 사본 가져오기로 원본을 덮어쓰지 않는 복구 사본을 만들 수 있습니다. 원본 PDF와 첨부파일은 PC에서 보존해야 합니다.</p></main><script type="module" src="/loxt-offline.js"></script></body></html>
