<div class="app">
<aside class="sidebar">
<div class="brand"><span class="mark"><i></i><i></i><i></i><i></i></span><span class="brand-name">소리노트</span></div>
<button class="primary" id="newRecording"><svg><use href="#mic"/></svg><span class="label">새 녹음</span></button>

<main class="main">

<section class="content" id="listView">
<div class="heading"><div><h1 id="listTitle">전체 녹음</h1><p>녹음부터 전사까지, 내 PC에서 편하게.</p></div><span class="sample">UI 시안</span></div>
<div class="toolbar"><label class="search"><svg><use href="#search"/></svg><input id="search" placeholder="녹음 제목 검색" aria-label="녹음 제목 검색"></label><select class="sort" id="sort" aria-label="정렬"><option value="date">최신순</option><option value="title">이름순</option></select></div>

<div class="local-tip"><svg><use href="#shield"/></svg><div><strong>녹음은 내 PC에, 전사는 내 GPU로.</strong><p>로컬 저장과 GPU 전사 기능이 연결될 자리입니다.</p></div></div>
</section>

const $=id=>document.getElementById(id);
const notes=[{id:1,title:'10월 첫째 주 주간 회의',folder:'회의',date:'2026.10.02',duration:'48:12',done:true},{id:2,title:'신규 서비스 사용자 인터뷰',folder:'인터뷰',date:'2026.10.01',duration:'32:05',done:true},{id:3,title:'산책하면서 떠오른 아이디어',folder:'개인 메모',date:'2026.09.30',duration:'05:41',done:false},{id:4,title:'디자인 방향 논의',folder:'회의',date:'2026.09.29',duration:'24:18',done:true},{id:5,title:'프로젝트 킥오프',folder:'회의',date:'2026.09.28',duration:'56:30',done:true},{id:6,title:'이번 주 할 일 정리',folder:'개인 메모',date:'2026.09.27',duration:'08:22',done:true}];
const segments=[['00:00','오늘 회의에서는 이번 주 진행 상황을 확인하고, 다음 주 일정까지 함께 정리하겠습니다.'],['00:18','먼저 지난번에 이야기했던 인터페이스부터 살펴볼게요. 녹음 목록에서 원하는 기록을 쉽게 찾을 수 있으면 좋겠습니다.'],['00:35','폴더별로 녹음을 정리하고, 제목을 바꿀 수 있도록 하면 관리하기 훨씬 편할 것 같아요.'],['00:52','녹음이 끝나면 원본 파일을 먼저 저장하고, 그다음 전사를 시작하는 방식으로 진행하죠.'],['01:14','전사문에서 문장을 누르면 해당 구간의 녹음으로 이동할 수 있게 하는 것도 필요합니다.'],['01:38','좋습니다. 우선 화면 구성을 확인한 다음에 실제 녹음과 GPU 전사 기능을 연결하겠습니다.']];
let filter='all',current=null,playTimer=null,recordTimer=null,recordSeconds=0,paused=false,toastTimer;
const escapeHtml=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function toast(s){$('toast').textContent=s;$('toast').classList.remove('hidden');clearTimeout(toastTimer);toastTimer=setTimeout(()=>$('toast').classList.add('hidden'),3200)}
function render(){let list=notes.filter(n=>!n.deleted && (filter==='all'||filter==='recent'||n.folder===filter));if(filter==='trash')list=notes.filter(n=>n.deleted);list=list.filter(n=>n.title.toLowerCase().includes($('search').value.toLowerCase()));if($('sort').value==='title')list.sort((a,b)=>a.title.localeCompare(b.title,'ko'));$('rows').innerHTML=list.length?list.map(n=>`<div class="row" role="button" tabindex="0" data-id="${n.id}" aria-label="${escapeHtml(n.title)} 열기"><div class="note"><div class="file-icon ${n.done?'':'pending'}"><svg><use href="#file"/></svg></div><div style="min-width:0"><div class="note-title">${escapeHtml(n.title)}</div><div class="note-folder">${escapeHtml(n.folder)}</div></div></div><span class="cell date">${n.date}</span><span class="cell duration">${n.duration}</span><span class="status ${n.done?'':'wait'}">${n.done?'✓ 완료':'전사 대기'}</span><button class="more" aria-label="${escapeHtml(n.title)} 관리" data-menu="${n.id}">⋯</button></div>`).join(''):'<div class="empty">표시할 녹음이 없습니다.</div>';$('total').textContent=`녹음 ${list.length}개`;document.querySelector('.nav .count').textContent=notes.filter(n=>!n.deleted).length;document.querySelectorAll('.folders button').forEach(b=>{const c=b.querySelector('.count');if(c)c.textContent=notes.filter(n=>!n.deleted&&n.folder===b.dataset.filter).length})}
function stopPlay(){clearInterval(playTimer);playTimer=null;$('play').textContent='▶'}
function showList(){if(recordTimer){toast('진행 중인 샘플 녹음을 먼저 종료해 주세요.');return}stopPlay();$('recordView')?.classList.add('hidden');$('detailView').classList.add('hidden');$('player').classList.add('hidden');$('listView').classList.remove('hidden');render()}
function openNote(id){current=notes.find(n=>n.id===id);$('listView').classList.add('hidden');$('detailView').classList.remove('hidden');$('player').classList.remove('hidden');$('noteTitle').value=current.title;$('noteMeta').textContent=`${current.folder}　 /　 ${current.date}　 /　 ${current.duration}`;const sec=current.duration.split(':').map(Number);$('seek').max=sec[0]*60+sec[1];$('seek').value=0;$('time').textContent='00:00';$('duration').textContent=current.duration;$('transcript').innerHTML=current.done?segments.map((s,i)=>`<div class="segment ${i===0?'active':''}"><button class="timestamp" data-segment="${i}">${s[0]}</button><p contenteditable="true" role="textbox" aria-label="${s[0]} 전사문">${escapeHtml(s[1])}</p></div>`).join(''):'<div class="empty">아직 전사하지 않은 녹음입니다.<br><br><button class="primary" id="demoTranscribe" style="margin:auto">샘플 전사 결과 보기</button></div>';if($('demoTranscribe'))$('demoTranscribe').onclick=()=>{current.done=true;openNote(current.id);toast('샘플 전사문입니다. 실제 전사 엔진은 연결되지 않았습니다.')};stopPlay()}
function chooseFilter(b){if(recordTimer){toast('진행 중인 샘플 녹음을 먼저 종료해 주세요.');return}filter=b.dataset.filter;document.querySelectorAll('[data-filter]').forEach(x=>x.classList.toggle('active',x===b));const name=filter==='all'?'전체 녹음':filter==='recent'?'최근 녹음':filter==='trash'?'휴지통':filter;$('listTitle').textContent=name;$('breadcrumb').textContent=name;showList()}
document.querySelectorAll('[data-filter]').forEach(b=>b.onclick=()=>chooseFilter(b));$('search').oninput=render;$('sort').onchange=render;$('back').onclick=showList;
$('rows').onclick=e=>{const m=e.target.closest('[data-menu]');if(m){manageNote(Number(m.dataset.menu));return}const r=e.target.closest('[data-id]');if(r)openNote(Number(r.dataset.id))};$('rows').onkeydown=e=>{if((e.key==='Enter'||e.key===' ')&&e.target.matches('[data-id]')){e.preventDefault();openNote(Number(e.target.dataset.id))}};
$('noteTitle').onchange=()=>{if($('noteTitle').value.trim()){current.title=$('noteTitle').value.trim();toast('시안에서 제목을 변경했습니다.')}else $('noteTitle').value=current.title};
function format(s){return String(Math.floor(s/60)).padStart(2,'0')+':'+String(s%60).padStart(2,'0')}
function updateTime(){$('time').textContent=format(Number($('seek').value));let active=0;segments.forEach((s,i)=>{const t=s[0].split(':').map(Number);if(Number($('seek').value)>=t[0]*60+t[1])active=i});document.querySelectorAll('.segment').forEach((el,i)=>el.classList.toggle('active',i===active))}
$('seek').oninput=updateTime;$('transcript').onclick=e=>{if(e.target.dataset.segment!==undefined){const t=segments[Number(e.target.dataset.segment)][0].split(':').map(Number);$('seek').value=t[0]*60+t[1];updateTime()}};$('play').onclick=()=>{if(playTimer){stopPlay();return}$('play').textContent='Ⅱ';playTimer=setInterval(()=>{const next=Number($('seek').value)+Number($('speed').value);$('seek').value=next;updateTime();if(next>=Number($('seek').max))stopPlay()},1000)};
function modal(html){$('dialog').innerHTML=html;$('overlay').classList.remove('hidden');$('dialog').querySelector('button,input')?.focus()}
function closeModal(){$('overlay').classList.add('hidden');$('newRecording').focus()}
document.addEventListener('keydown',e=>{if(e.key==='Escape')closeModal();if(e.key==='Tab'&&!$('overlay').classList.contains('hidden')){const items=[...$('dialog').querySelectorAll('button,input,select')].filter(x=>!x.disabled);const first=items[0],last=items[items.length-1];if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}});$('overlay').onclick=e=>{if(e.target===$('overlay')||e.target.closest('[data-close]'))closeModal()};
function header(t){return `<div class="dialog-header"><h2 id="dialogTitle">${t}</h2><button data-close aria-label="닫기">✕</button></div>`}
$('newRecording').onclick=()=>{
if(recordTimer){toast('현재 녹음 페이지에서 계속할 수 있어요.');return}
stopPlay();recordSeconds=0;paused=false;
let page=$('recordView');if(!page){page=document.createElement('section');page.id='recordView';page.className='content record-page';document.querySelector('.main').insertBefore(page,$('player'))}
page.classList.remove('hidden');$('listView').classList.add('hidden');$('detailView').classList.add('hidden');$('player').classList.add('hidden');$('breadcrumb').textContent='새 녹음';document.querySelectorAll('[data-filter]').forEach(b=>b.classList.remove('active'));
page.innerHTML=`<button class="back" id="recordBack">← 녹음 목록</button><div class="heading"><div><h1>새 녹음</h1><p>녹음을 마치면 내 PC에서 전사를 시작합니다.</p></div><span class="sample">UI 시안</span></div><div class="record-fields"><div class="title-field"><label for="recordTitle">녹음 제목</label><input class="field" id="recordTitle" value="새 녹음"></div><div class="folder-field"><label for="recordFolder">저장할 폴더</label><select class="field" id="recordFolder">${[...document.querySelectorAll('.folders button')].map(b=>`<option ${b.dataset.filter===filter?'selected':''}>${escapeHtml(b.dataset.filter)}</option>`).join('')}</select></div></div><div class="recording" id="recordPanel"><div class="record-state" id="recordState">녹음 준비 완료</div><div class="wave">${[12,23,36,19,42,28,48,32,20,38,25,13].map(h=>`<i style="height:${h}px"></i>`).join('')}</div><div class="clock" id="recordClock">00:00</div><div class="record-actions"><button class="secondary" id="pause" disabled>일시정지</button><button class="primary" id="recordStart"><svg><use href="#mic"/></svg>녹음 시작</button></div></div><label class="record-options"><input type="checkbox" id="autoTranscribe" checked>녹음 종료 후 자동 전사</label><p class="hint">샘플 녹음 화면입니다. 실제 마이크를 사용하지 않습니다.<br>제목과 폴더를 선택하고 녹음 시작·일시정지·종료 흐름을 확인해 보세요.</p>`;
$('recordBack').onclick=()=>{if(recordTimer){toast('진행 중인 샘플 녹음을 먼저 종료해 주세요.');return}chooseFilter(document.querySelector('[data-filter="all"]'))};
let started=false;$('recordStart').onclick=()=>{
if(!started){started=true;$('recordStart').textContent='■ 녹음 종료';$('pause').disabled=false;$('recordState').textContent='녹음 중';$('recordPanel').classList.add('is-recording');recordTimer=setInterval(()=>{if(!paused){recordSeconds++;$('recordClock').textContent=format(recordSeconds)}},1000)}
else{const auto=$('autoTranscribe').checked;const n={id:Date.now(),title:$('recordTitle').value.trim()||'새 녹음',folder:$('recordFolder').value,date:'2026.10.02',duration:format(recordSeconds),done:auto};notes.unshift(n);clearInterval(recordTimer);recordTimer=null;page.classList.add('hidden');chooseFilter(document.querySelector('[data-filter="all"]'));openNote(n.id);toast(auto?'샘플 전사 결과입니다. 실제 녹음·전사는 연결 전입니다.':'샘플 녹음을 추가했습니다. 실제 녹음은 저장되지 않습니다.')}
};$('pause').onclick=()=>{paused=!paused;$('pause').textContent=paused?'녹음 계속':'일시정지';$('recordState').textContent=paused?'일시정지됨':'녹음 중';$('recordPanel').classList.toggle('is-paused',paused)};
};
function gpuModal(){modal(header('로컬 전사 설정')+`<p style="color:#748196;line-height:1.8;font-size:13px">내 PC에 맞는 전사 환경을 확인하는 화면입니다.</p><div class="gpu-detail">그래픽카드 <span>NVIDIA RTX 2060</span><br>전사 모델 <span>추후 선택</span><br>전사 언어 <span>한국어</span><br>실행 환경 <span>연결 전</span></div><p class="hint">표시된 GPU는 예시입니다. 실제 PC 환경을 감지하거나 모델을 실행하지 않습니다.</p><button class="primary" data-close style="width:100%;margin-top:24px">확인</button>`)}$('gpuButton').onclick=gpuModal;$('settingsButton').onclick=gpuModal;
$('addFolder').onclick=()=>{modal(header('새 폴더')+'<label for="folderName">폴더 이름</label><input class="field" id="folderName" placeholder="예: 강의 기록"><button class="primary" id="saveFolder" style="width:100%;margin-top:24px">폴더 만들기</button>');$('saveFolder').onclick=()=>{const name=$('folderName').value.trim();if(!name)return;if([...document.querySelectorAll('.folders button')].some(b=>b.dataset.filter===name)){toast('이미 있는 폴더 이름입니다.');return}const b=document.createElement('button');b.dataset.filter=name;b.innerHTML='<svg><use href="#folder"/></svg>'+escapeHtml(name)+'<span class="count">0</span>';b.onclick=()=>chooseFilter(b);$('folders').appendChild(b);closeModal();chooseFilter(b);toast('시안에서 폴더를 만들었습니다.')}};
function manageNote(id){const n=notes.find(n=>n.id===id);modal(header('녹음 관리')+`<label for="manageTitle">제목</label><input class="field" id="manageTitle" value="${escapeHtml(n.title)}"><label for="manageFolder">폴더</label><select class="field" id="manageFolder">${[...document.querySelectorAll('.folders button')].map(b=>`<option ${b.dataset.filter===n.folder?'selected':''}>${escapeHtml(b.dataset.filter)}</option>`).join('')}</select><div class="record-actions"><button class="secondary" id="deleteNote">${n.deleted?'복원':'휴지통으로'}</button><button class="primary" id="saveNote">변경 저장</button></div>`);$('saveNote').onclick=()=>{n.title=$('manageTitle').value.trim()||n.title;n.folder=$('manageFolder').value;closeModal();render();toast('시안에서 변경했습니다.')};$('deleteNote').onclick=()=>{n.deleted=!n.deleted;closeModal();render();toast(n.deleted?'휴지통으로 이동했습니다.':'녹음을 복원했습니다.')}}
$('uploadButton').onclick=()=>$('fileInput').click();$('fileInput').onchange=()=>{const f=$('fileInput').files[0];if(!f)return;notes.unshift({id:Date.now(),title:f.name.replace(/\.[^.]+$/,''),folder:'개인 메모',date:'2026.10.02',duration:'00:00',done:false});chooseFilter(document.querySelector('[data-filter="all"]'));toast('파일 이름만 목록에 추가했습니다. 파일은 업로드되지 않습니다.');$('fileInput').value=''};
$('export').onclick=()=>{if(!current.done){toast('전사문이 없습니다.');return}const text=current.title+'\n\n'+[...document.querySelectorAll('.segment')].map(el=>el.querySelector('.timestamp').textContent+' '+el.querySelector('p').textContent).join('\n\n');const url=URL.createObjectURL(new Blob(['\ufeff'+text],{type:'text/plain;charset=utf-8'}));const a=document.createElement('a');a.href=url;a.download=current.title.replace(/[\\/:*?"<>|]/g,'_')+' (시안).txt';a.click();setTimeout(()=>URL.revokeObjectURL(url),1000)};
render();
</script>
</body>
</html>
